name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the version from tags
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Docs are up to date
        run: dotnet run --project tools/SharpCell.Grid.Docs -c Release -f net10.0 --no-build -- check
      - name: Snapshots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-snapshots
          path: tests/**/*.received.png
          if-no-files-found: ignore
      - name: Pack
        run: dotnet pack SharpCell.Grid.slnx -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages

  # WPF runs on Windows only; elsewhere its tests are built but not run.
  wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test --project tests/SharpCell.Grid.Wpf.Tests -c Release
