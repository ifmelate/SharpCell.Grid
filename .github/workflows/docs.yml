name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test
      - name: Docs are up to date
        run: dotnet run --project tools/SharpCell.Grid.Docs -f net10.0 -- check
      - name: Build the site
        run: dotnet run --project tools/SharpCell.Grid.Docs -f net10.0 -- site artifacts/site
      # The live demo: Skia's native code is linked into dotnet.wasm, which needs the workload.
      - name: Install the WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Build the live demo
        run: dotnet publish samples/SharpCell.Grid.Demo -c Release -o artifacts/demo
      - name: Add the live demo to the site
        run: cp -r artifacts/demo/wwwroot artifacts/site/demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
